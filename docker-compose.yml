services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atdev_accounts
      POSTGRES_USER: atdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - atdev_accounts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atdev -d atdev_accounts"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  auth:
    build: ./auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://atdev:${POSTGRES_PASSWORD}@postgres:5432/atdev_accounts
      PGSSLMODE: disable
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?Set AUTH_SERVICE_TOKEN in .env}
    ports:
      - "8080:8080"
    networks: [private]
volumes:
  atdev_accounts_data:
networks:
  private:
    driver: bridge
