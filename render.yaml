services:
  - type: web
    name: atdev-cloud-auth
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SERVICE_TOKEN
        generateValue: true
      - key: PGSSLMODE
        value: require
      - key: PG_POOL_MAX
        value: "5"
