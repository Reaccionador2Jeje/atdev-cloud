name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:worker
      - run: node --check dist/worker.mjs
      - run: node --check scripts/finance-ledger.mjs
      - run: node --check scripts/export-storage.mjs
      - run: npm run finance:report
      - run: npm test
